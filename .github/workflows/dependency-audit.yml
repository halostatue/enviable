name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Hex Dependency Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # Upload the SARIF output

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29'
          elixir-version: '1.20'

      - run: mix deps.get

      - name: hex.audit (Pull Request)
        run: mix hex.audit --format sarif --output hex-audit.sarif || true
        if: github.event_name == 'pull_request'

      - name: hex.audit
        run: mix hex.audit --format sarif --output hex-audit.sarif
        if: github.event_name != 'pull_request'

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: hex-audit.sarif
          category: hex-audit
